<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="帰ろう">
  <meta name="theme-color" content="#0e1117">
  <link rel="manifest" href="manifest.json">
  <!-- Apple touch icon (SVG inline as data URI) -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>帰ろう</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e1117;
      --surface: #161b25;
      --card: #1c2333;
      --border: rgba(255,255,255,0.07);
      --text: #e6eaf4;
      --muted: #5c657a;
      --green: #3ecf8e;
      --green-dim: rgba(62,207,142,0.12);
      --yellow: #f5a623;
      --yellow-dim: rgba(245,166,35,0.12);
      --red: #f26b6b;
      --red-dim: rgba(242,107,107,0.12);
      --blue: #5b9cf6;
      --blue-dim: rgba(91,156,246,0.1);
      --sobu: #f0a030;
      --tozai: #00a0c8;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Noto Sans JP','Hiragino Sans',sans-serif; overflow-x:hidden; }

    #app { max-width:430px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

    /* ── Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: env(safe-area-inset-top, 16px) 20px 16px;
      padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
    }
    .header-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
    .app-label { font-size:10px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:4px; }
    .clock-row { display:flex; align-items:baseline; gap:3px; }
    .clock-hhmm { font-family:'DM Mono',monospace; font-size:46px; font-weight:500; letter-spacing:-2px; color:var(--text); line-height:1; }
    .clock-ss { font-family:'DM Mono',monospace; font-size:20px; color:var(--muted); }
    .clock-date { font-size:12px; color:var(--muted); margin-top:4px; }
    .bus-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 14px; text-align:right; }
    .bus-card .bl { font-size:10px; color:var(--muted); }
    .bus-card .bv { font-size:12px; font-weight:700; color:var(--text); margin-top:2px; }
    .bus-card .bn { font-size:10px; color:var(--muted); margin-top:2px; }

    /* Train picker */
    .train-picker { background:rgba(255,255,255,0.04); border-radius:12px; padding:10px 14px; }
    .tp-label { font-size:10px; color:var(--muted); margin-bottom:7px; }
    .tp-buttons { display:flex; gap:7px; flex-wrap:wrap; }
    .tp-btn {
      font-family:'DM Mono',monospace; font-size:13px;
      padding:5px 12px; border-radius:8px; border:none; cursor:pointer;
      background:rgba(255,255,255,0.07); color:var(--muted);
      transition:all .15s;
    }
    .tp-btn.selected { background:var(--text); color:var(--bg); font-weight:700; }

    /* ── Main scroll */
    .main { flex:1; padding:16px 16px 40px; overflow-y:auto; }
    .section-head { font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:10px; padding:0 2px; }

    /* ── Route card */
    .route-card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px; overflow:hidden;
      box-shadow:0 2px 12px rgba(0,0,0,.2);
      position:relative;
    }
    .route-card.best { border-color:rgba(62,207,142,.25); box-shadow:0 0 0 1px rgba(62,207,142,.1),0 4px 24px rgba(0,0,0,.3); }
    .best-line { position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--green),transparent); }

    .rc-head { display:flex; justify-content:space-between; align-items:flex-start; padding:14px 16px 12px; border-bottom:1px solid var(--border); }
    .rc-title { font-size:18px; font-weight:900; letter-spacing:-.5px; }
    .rc-sub { font-size:11px; color:var(--muted); margin-top:2px; }
    .tag { font-size:10px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap; border:1px solid transparent; }
    .tag-green { background:var(--green-dim); color:var(--green); border-color:rgba(62,207,142,.2); }
    .tag-yellow { background:var(--yellow-dim); color:var(--yellow); border-color:rgba(245,166,35,.2); }

    .rc-seat { padding:12px 16px; border-bottom:1px solid var(--border); }
    .seat-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:10px; color:var(--muted); }
    .seat-pct { font-family:'DM Mono',monospace; font-size:15px; font-weight:700; }
    .seat-bar { height:6px; background:rgba(255,255,255,.07); border-radius:10px; overflow:hidden; }
    .seat-fill { height:100%; border-radius:10px; transition:width 1.2s cubic-bezier(.4,0,.2,1); }

    .rc-times { display:flex; border-bottom:1px solid var(--border); }
    .tc { flex:1; text-align:center; padding:10px 4px; border-right:1px solid var(--border); }
    .tc:last-child { border-right:none; }
    .tc-l { font-size:9px; color:var(--muted); margin-bottom:3px; }
    .tc-v { font-family:'DM Mono',monospace; font-size:16px; font-weight:600; }
    .tc-n { font-size:9px; color:var(--muted); margin-top:2px; }

    .rc-viz { padding:12px 16px 4px; display:flex; align-items:center; }
    .viz-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .viz-line { flex:1; height:3px; border-radius:3px; margin-bottom:10px; }
    .viz-label { font-size:9px; color:var(--muted); white-space:nowrap; margin-top:2px; }
    .viz-node { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .rc-reason { padding:0 16px 14px; }
    .reason-chip { display:inline-flex; align-items:center; font-size:11px; color:var(--muted); background:rgba(255,255,255,.04); border-radius:8px; padding:5px 10px; }

    /* VS */
    .vs-row { display:flex; align-items:center; gap:10px; padding:10px 4px; }
    .vs-line { flex:1; height:1px; background:var(--border); }
    .vs-badge { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:2px; }

    /* AI advice */
    .ai-card { background:var(--blue-dim); border:1px solid rgba(91,156,246,.15); border-radius:14px; overflow:hidden; margin-top:12px; }
    .ai-head { padding:12px 16px; border-bottom:1px solid rgba(91,156,246,.1); display:flex; justify-content:space-between; align-items:center; }
    .ai-title { font-size:12px; font-weight:700; color:var(--blue); }
    .ai-btn { font-size:11px; font-weight:700; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:5px 12px; cursor:pointer; transition:opacity .2s; }
    .ai-btn:disabled { opacity:.5; cursor:default; }
    .ai-body { padding:12px 16px; min-height:56px; }
    .ai-text { font-size:13px; color:rgba(180,205,240,.9); line-height:1.65; }
    .ai-placeholder { font-size:12px; color:var(--muted); font-style:italic; }

    /* Install banner */
    .install-banner {
      display:none;
      position:fixed; bottom:0; left:0; right:0;
      background:var(--surface); border-top:1px solid var(--border);
      padding:14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
      flex-direction:column; gap:10px; z-index:100;
    }
    .install-banner.show { display:flex; }
    .ib-text { font-size:13px; color:var(--text); line-height:1.5; }
    .ib-text span { color:var(--green); font-weight:700; }
    .ib-actions { display:flex; gap:8px; }
    .ib-btn { flex:1; padding:10px; border-radius:10px; border:none; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit; }
    .ib-add { background:var(--green); color:#000; }
    .ib-dismiss { background:rgba(255,255,255,.07); color:var(--muted); }

    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .route-card { animation:fadeIn .4s ease both; }
    .route-card:nth-child(3) { animation-delay:.1s; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="app-label">帰ろう</div>
        <div class="clock-row">
          <span class="clock-hhmm" id="hhmm">--:--</span>
          <span class="clock-ss" id="ss">--</span>
        </div>
        <div class="clock-date" id="datestr">---</div>
      </div>
      <div class="bus-card">
        <div class="bl">🚌 移動中</div>
        <div class="bv">海浜幕張→幕張本郷</div>
        <div class="bn">バス乗車中</div>
      </div>
    </div>
    <div class="train-picker">
      <div class="tp-label">🚃 幕張本郷 上り · 乗る電車を選択</div>
      <div class="tp-buttons" id="trainButtons">
        <span class="tp-btn" style="color:var(--muted);font-size:12px;">時刻を取得中…</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="section-head">どっちで乗り換える？</div>
    <div id="cardTsudanuma"></div>
    <div class="vs-row"><div class="vs-line"></div><span class="vs-badge">VS</span><div class="vs-line"></div></div>
    <div id="cardNishifuna"></div>

    <div class="ai-card" style="--blue-dim:rgba(91,156,246,0.1);">
      <div class="ai-head">
        <div class="ai-title">🤖 AIアドバイス</div>
        <button class="ai-btn" id="aiBtn" onclick="fetchAdvice()">判断してもらう</button>
      </div>
      <div class="ai-body" id="aiBody">
        <div class="ai-placeholder">ボタンを押すと、現在の時間帯・混雑状況をもとにアドバイスが届きます</div>
      </div>
    </div>
  </div>
</div>

<!-- iOS install banner -->
<div class="install-banner" id="installBanner">
  <div class="ib-text">📱 ホーム画面に追加すると<span>アプリとして起動</span>できます<br><small style="color:var(--muted)">Safari → 共有ボタン →「ホーム画面に追加」</small></div>
  <div class="ib-actions">
    <button class="ib-btn ib-dismiss" onclick="dismissInstall()">後で</button>
    <button class="ib-btn ib-add" onclick="dismissInstall()">わかった！</button>
  </div>
</div>

<script>
// ── 時刻表（幕張本郷 上り・平日）
const TIMETABLE = [
  "06:02","06:14","06:25","06:36","06:47","06:58",
  "07:06","07:14","07:22","07:29","07:36","07:42","07:48","07:54",
  "08:00","08:06","08:12","08:18","08:24","08:30","08:36","08:43","08:50","08:57",
  "09:04","09:11","09:19","09:27","09:35","09:43","09:51","09:59",
  "10:08","10:17","10:26","10:35","10:44","10:53",
  "11:02","11:11","11:20","11:29","11:38","11:47","11:56",
  "12:05","12:14","12:23","12:32","12:41","12:50","12:59",
  "13:08","13:17","13:26","13:35","13:44","13:53",
  "14:02","14:11","14:20","14:29","14:38","14:47","14:56",
  "15:05","15:14","15:23","15:32","15:41","15:50","15:59",
  "16:08","16:17","16:26","16:35","16:44","16:53",
  "17:02","17:10","17:18","17:26","17:34","17:42","17:50","17:58",
  "18:06","18:13","18:20","18:27","18:34","18:41","18:48","18:55",
  "19:02","19:09","19:16","19:23","19:30","19:37","19:44","19:51","19:58",
  "20:06","20:14","20:22","20:30","20:38","20:46","20:54",
  "21:02","21:11","21:20","21:29","21:38","21:47","21:56",
  "22:05","22:14","22:23","22:32","22:41","22:50","22:59",
  "23:08","23:17","23:26","23:35","23:44","23:53",
];

let selectedTrain = null;
let lastCardMinute = -1; // カードを最後に描画した分

function timeToDate(hhmm) {
  const [h,m] = hhmm.split(":").map(Number);
  const d = new Date(); d.setHours(h,m,0,0); return d;
}
function fmt(d) {
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function addMin(d, m) { return new Date(d.getTime() + m*60000); }

function getNextTrains(now, n=4) {
  return TIMETABLE.map(t=>({label:t,date:timeToDate(t)})).filter(t=>t.date>now).slice(0,n);
}

function crowdScore(h, m, station) {
  const t = h + m/60;
  if (station==="tsudanuma") {
    if (t>=7.5&&t<9.5) return 45;
    if (t>=17.5&&t<19.5) return 40;
    if (t>=19.5&&t<21) return 30;
    return 20;
  } else {
    if (t>=7.5&&t<9.5) return 85;
    if (t>=17.5&&t<19.5) return 70;
    if (t>=19.5&&t<21) return 55;
    return 35;
  }
}
function seatProb(score) { return Math.max(10, 100-score); }

function renderCard(containerId, opts) {
  const { station, label, sub, arrMin, transferMin, tozaiMin, isBest, seat, train } = opts;
  const color = seat>=65 ? "var(--green)" : seat>=45 ? "var(--yellow)" : "var(--red)";
  const dimColor = seat>=65 ? "var(--green-dim)" : seat>=45 ? "var(--yellow-dim)" : "var(--red-dim)";

  const arrive    = train ? fmt(addMin(train.date, arrMin)) : "--:--";
  const tozaiDep  = train ? fmt(addMin(train.date, arrMin+transferMin)) : "--:--";
  const goal      = train ? fmt(addMin(train.date, arrMin+transferMin+tozaiMin)) : "--:--";
  const totalMin  = arrMin+transferMin+tozaiMin;

  const viaName = station==="tsudanuma" ? "津田沼" : "西船橋";
  const lineColor1 = "var(--sobu)";
  const lineColor2 = "var(--tozai)";

  document.getElementById(containerId).innerHTML = `
    <div class="route-card ${isBest?"best":""}">
      ${isBest ? '<div class="best-line"></div>' : ''}
      <div class="rc-head">
        <div>
          <div class="rc-title">${label}</div>
          <div class="rc-sub">${sub}</div>
        </div>
        <div class="tag ${isBest?"tag-green":"tag-yellow"}">${isBest?"✓ おすすめ":"△ 早着"}</div>
      </div>
      <div class="rc-seat">
        <div class="seat-row">
          <span>着席確率</span>
          <span class="seat-pct" style="color:${color}">${seat}%</span>
        </div>
        <div class="seat-bar">
          <div class="seat-fill" style="width:${seat}%;background:${color}"></div>
        </div>
      </div>
      <div class="rc-times">
        <div class="tc"><div class="tc-l">${viaName} 着</div><div class="tc-v">${arrive}</div><div class="tc-n">${train?train.label+"発":"--"}</div></div>
        <div class="tc"><div class="tc-l">東西線 発</div><div class="tc-v">${tozaiDep}</div><div class="tc-n">乗換 約${transferMin}分</div></div>
        <div class="tc"><div class="tc-l">高田馬場 着</div><div class="tc-v">${goal}</div><div class="tc-n">計 約${totalMin}分</div></div>
      </div>
      <div class="rc-viz">
        <div class="viz-node"><div class="viz-dot" style="background:${lineColor1}"></div><div class="viz-label">幕張本郷</div></div>
        <div class="viz-line" style="background:${lineColor1}"></div>
        <div class="viz-node"><div class="viz-dot" style="background:${lineColor2}"></div><div class="viz-label">${viaName}</div></div>
        <div class="viz-line" style="background:${lineColor2}"></div>
        <div class="viz-node"><div class="viz-dot" style="background:var(--text)"></div><div class="viz-label">高田馬場</div></div>
      </div>
      <div class="rc-reason">
        <div class="reason-chip">${station==="tsudanuma"?"💺 始発のため空席あり · 乗換1回":"⏱ 最速ルート · 立つ可能性あり"}</div>
      </div>
    </div>`;
}

const WEEKDAYS = ["日","月","火","水","木","金","土"];

function tick() {
  const now = new Date();
  const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
  document.getElementById("hhmm").textContent =
    `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  document.getElementById("ss").textContent = String(s).padStart(2,"0");
  document.getElementById("datestr").textContent =
    `${now.getMonth()+1}月${now.getDate()}日（${WEEKDAYS[now.getDay()]}）`;

  // 列車リスト更新（秒が0のときだけ、または初回）
  if (s===0 || !selectedTrain) updateTrains(now);

  // カードは「分が変わったとき」だけ再描画（チカチカ防止）
  if (m !== lastCardMinute) {
    lastCardMinute = m;
    renderCards(h, m);
  }
}

function renderCards(h, m) {
  const sT = seatProb(crowdScore(h,m,"tsudanuma"));
  const sN = seatProb(crowdScore(h,m,"nishifuna"));
  const bestIs = sT>=sN ? "tsudanuma" : "nishifuna";

  renderCard("cardTsudanuma",{
    station:"tsudanuma", label:"津田沼 乗換",
    sub:"東西線 直通始発 · 座席確保しやすい",
    arrMin:2, transferMin:5, tozaiMin:45,
    isBest: bestIs==="tsudanuma",
    seat:sT, train:selectedTrain
  });
  renderCard("cardNishifuna",{
    station:"nishifuna", label:"西船橋 乗換",
    sub:"東西線 途中乗車 · 座れない可能性あり",
    arrMin:11, transferMin:3, tozaiMin:43,
    isBest: bestIs==="nishifuna",
    seat:sN, train:selectedTrain
  });
}

function updateTrains(now) {
  const trains = getNextTrains(now, 4);
  const container = document.getElementById("trainButtons");
  if (trains.length===0) {
    container.innerHTML = '<span style="font-size:12px;color:var(--muted)">本日の運行は終了しました</span>';
    return;
  }
  if (!selectedTrain || !trains.find(t=>t.label===selectedTrain.label)) {
    selectedTrain = trains[0];
  }
  container.innerHTML = trains.map((t,i)=>`
    <button class="tp-btn ${selectedTrain?.label===t.label?"selected":""}"
      onclick="selectTrain('${t.label}')">
      ${i===0 ? t.label+" ▶" : t.label}
    </button>`).join("");
}

function selectTrain(label) {
  const now = new Date();
  const trains = getNextTrains(now, 4);
  selectedTrain = trains.find(t=>t.label===label) || trains[0];
  updateTrains(now);
  lastCardMinute = -1; // 強制再描画
  tick();
}

async function fetchAdvice() {
  const btn = document.getElementById("aiBtn");
  const body = document.getElementById("aiBody");
  if (!selectedTrain) return;
  btn.disabled = true;
  btn.textContent = "考え中…";
  body.innerHTML = '<div class="ai-placeholder">AIが考えています...</div>';

  const now = new Date();
  const h=now.getHours(), m=now.getMinutes();
  const sT = seatProb(crowdScore(h,m,"tsudanuma"));
  const sN = seatProb(crowdScore(h,m,"nishifuna"));
  const timeStr = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{role:"user",content:`あなたは電車通勤のアドバイザーです。
現在時刻: ${timeStr}
選択した列車: 幕張本郷 ${selectedTrain.label}発（総武線 上り）
津田沼乗換の着席確率: ${sT}%
西船橋乗換の着席確率: ${sN}%
ルート: 幕張本郷→（総武線）→津田沼 or 西船橋→（東西線）→高田馬場→（西武新宿線）→自宅

座って帰ることを最優先に、津田沼・西船橋どちらで乗り換えるべきか、理由とともに2〜3文で端的にアドバイスしてください。日本語で返答してください。`}]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b=>b.type==="text")?.text || "取得できませんでした";
    body.innerHTML = `<div class="ai-text">${text.replace(/\n/g,"<br>")}</div>`;
  } catch(e) {
    body.innerHTML = '<div class="ai-placeholder">取得に失敗しました。ネットワークを確認してください。</div>';
  }
  btn.disabled = false;
  btn.textContent = "もう一度聞く";
}

function dismissInstall() {
  document.getElementById("installBanner").classList.remove("show");
  localStorage.setItem("installDismissed","1");
}

// ── iOS Safari install prompt
function checkInstallPrompt() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone;
  const dismissed = localStorage.getItem("installDismissed");
  if (isIOS && !isStandalone && !dismissed) {
    setTimeout(()=>document.getElementById("installBanner").classList.add("show"), 3000);
  }
}

// ── Service Worker 登録
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

// ── 起動
tick();
setInterval(tick, 1000);
checkInstallPrompt();
</script>
